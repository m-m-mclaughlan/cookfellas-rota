<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookfella's Bar & Eatery — Rota</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #16211B; }
  #boot { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #9AA79C; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div id="boot">Loading rota…</div>
<script>
(async function () {
  try {
    const response = await fetch('./app-original.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load rota app');
    let html = await response.text();

    const availabilityPatch = `
<style id="availability-split-vertical-fix">
button[title*="available mornings only"] {
  background: linear-gradient(to right, #C9A24B66 0%, #C9A24B66 50%, transparent 50%, transparent 100%) !important;
}
button[title*="available evenings only"] {
  background: linear-gradient(to right, transparent 0%, transparent 50%, #C9A24B66 50%, #C9A24B66 100%) !important;
}
</style>`;
    html = html.replace('</head>', availabilityPatch + '</head>');

    // Make linked/aligned days off a hard auto-scheduling constraint.
    const strictAlignFn = "ArStrict=(e,t,n,a,l,c,h=2,d=2)=>{\n  let y={...n},x={...l};\n  if(!c)return{assignments:y,barAssignments:x};\n  let[A,T]=c,R=Object.fromEntries(e.map(s=>[s.id,s])),\n      w=[...t.map(s=>({slot:s,board:\"r\"})),...a.map(s=>({slot:s,board:\"b\"}))],\n      j=q=>q.board===\"r\"?y[q.slot.id]:x[q.slot.id],\n      M=(q,id)=>{if(q.board===\"r\"){id?y[q.slot.id]=id:delete y[q.slot.id]}else{id?x[q.slot.id]=id:delete x[q.slot.id]}},\n      O=id=>{let z=new Set;w.forEach(q=>{j(q)===id&&z.add(q.slot.day)});return z},\n      E=id=>w.reduce((z,q)=>j(q)===id?z+W(q.slot.time)*60:z,0),\n      Y=(id,day)=>O(id).has(day),\n      N=(id,day)=>{let z=O(id);z.add(day);for(let k=0;k<m.length;k++){let u=m[k],v=m[(k+1)%m.length];if(!z.has(u)&&!z.has(v))return!0}return!1},\n      P=(id,q)=>{let s=R[id];if(!s||!Q(s,q.slot.day,q.slot.time)||Y(id,q.slot.day))return!1;if(q.board===\"r\"&&D(s.level)<D(q.slot.role))return!1;let z=E(id)+W(q.slot.time)*60;if(s.contractType===\"contracted\"&&z>s.contractedHours*60+h*60)return!1;let k=O(id);if(s.contractType===\"zeroHours\"&&s.wantedShiftsPerWeek!=null&&k.size>=s.wantedShiftsPerWeek)return!1;return N(id,q.slot.day)},\n      C=(day,flag,exclude)=>w.some(q=>q!==exclude&&q.slot.day===day&&q.slot[flag]&&R[j(q)]?.isManager),\n      H=(q,oldId,newId)=>{if(!R[oldId]?.isManager||R[newId]?.isManager)return!1;return(q.slot.isOpen&&!C(q.slot.day,\"isOpen\",q))||(q.slot.isClose&&!C(q.slot.day,\"isClose\",q))},\n      B=(id,q)=>{let s=R[id],cur=E(id),score=0;if(s.contractType===\"contracted\"){let min=Math.max(0,s.contractedHours*60-d*60);score=cur<min?cur-min:200000+cur}else score=100000+cur;if(q.board===\"b\")score+=s.isBarStaff?-10000:0;else score+=s.isBarStaff?10000:0;return score};\n  for(let day of m){\n    let aw=Y(A,day),tw=Y(T,day);\n    if(aw===tw)continue;\n    let working=aw?A:T,missing=aw?T:A,ms=R[missing];\n    if(!ms)continue;\n    let options=w.filter(q=>{\n      if(q.slot.day!==day||!P(missing,q))return!1;\n      let occ=j(q);\n      if(occ===A||occ===T)return!1;\n      if(occ&&R[occ]?.contractType!==\"zeroHours\")return!1;\n      return !occ||!H(q,occ,missing)\n    }).sort((q1,q2)=>{\n      let o1=j(q1),o2=j(q2),s1=(o1?1000:0)+B(missing,q1),s2=(o2?1000:0)+B(missing,q2);\n      return s1-s2\n    });\n    if(options.length){M(options[0],missing);continue}\n    let mine=w.filter(q=>q.slot.day===day&&j(q)===working);\n    mine.forEach(q=>M(q,null));\n    for(let q of mine){\n      let needMgr=(q.slot.isOpen&&!C(day,\"isOpen\",null))||(q.slot.isClose&&!C(day,\"isClose\",null));\n      let candidates=e.filter(s=>s.id!==A&&s.id!==T&&P(s.id,q)&&(!needMgr||s.isManager))\n        .sort((s1,s2)=>B(s1.id,q)-B(s2.id,q));\n      if(candidates.length)M(q,candidates[0].id)\n    }\n  }\n  return{assignments:y,barAssignments:x}\n}";
    const schedulerMarker = '},xe=(e,t,{maxOvertimeHours';
    if (!html.includes(schedulerMarker)) throw new Error('Scheduler marker not found');
    html = html.replace(schedulerMarker, '},' + strictAlignFn + ',xe=(e,t,{maxOvertimeHours');

    const alignedA = 'return{...e,assignments:a.assignments,bar:{...e.bar,assignments:a.barAssignments}}';
    const alignedAReplacement = 'let __aligned=ArStrict(e.staff,e.slots,a.assignments,e.bar.slots,a.barAssignments,We(e.staff,e.linkedDaysOff),e.maxOvertimeHours??2,e.allowedShortfallHours??2);return{...e,assignments:__aligned.assignments,bar:{...e.bar,assignments:__aligned.barAssignments}}';
    if (!html.includes(alignedA)) throw new Error('Combined assignment marker A not found');
    html = html.split(alignedA).join(alignedAReplacement);

    const alignedC = 'return{...e,assignments:c.assignments,bar:{...e.bar,assignments:c.barAssignments}}';
    const alignedCReplacement = 'let __aligned=ArStrict(e.staff,e.slots,c.assignments,e.bar.slots,c.barAssignments,We(e.staff,e.linkedDaysOff),e.maxOvertimeHours??2,e.allowedShortfallHours??2);return{...e,assignments:__aligned.assignments,bar:{...e.bar,assignments:__aligned.barAssignments}}';
    if (!html.includes(alignedC)) throw new Error('Combined assignment marker C not found');
    html = html.replace(alignedC, alignedCReplacement);

    html = html.replace('"Aligned days off"', '"Aligned days off · strict"');

    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error(error);
    document.getElementById('boot').textContent = 'Rota failed to load. Please refresh the page.';
  }
})();
</script>
</body>
</html>
