<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookfella's Bar & Eatery — Rota</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #16211B; }
  #boot { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #9AA79C; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div id="boot">Loading rota…</div>
<script src="./patches.js?v=20260817-0010"></script>
<script src="./contract-topup.js?v=20260817-0010"></script>
<script src="./contract-cap.js?v=20260817-0010"></script>
<script src="./off-plan.js?v=20260817-0010"></script>
<script src="./availability-guard.js?v=20260817-0010"></script>
<script src="./wlb-optimizer.js?v=20260817-0010"></script>
<script src="./balanced-template.js?v=20260817-0010"></script>
<script src="./fran-friday.js?v=20260817-0010"></script>
<script src="./saturday-foh.js?v=20260817-0010"></script>
<script src="./bar-floor-guard.js?v=20260817-0010"></script>
<script src="./clean-shift-labels.js?v=20260817-0010"></script>
<script>
(async function () {
  try {
    const response = await fetch('./app-original.html?v=20260817-0010', { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load rota app');
    let html = await response.text();
    if (typeof window.applyCookfellasPatches !== 'function') throw new Error('Rota patches failed to load');
    if (typeof window.applyContractTopupPatch !== 'function') throw new Error('Contract top-up patch failed to load');
    if (typeof window.applyContractCapPatch !== 'function') throw new Error('Contract cap patch failed to load');
    if (typeof window.applyContractOffPlanPatch !== 'function') throw new Error('Contract off-plan patch failed to load');
    if (typeof window.applyAvailabilityGuardPatch !== 'function') throw new Error('Availability guard patch failed to load');
    html = window.applyCookfellasPatches(html);
    html = window.applyContractTopupPatch(html);
    html = window.applyContractCapPatch(html);
    html = window.applyContractOffPlanPatch(html);
    html = window.applyAvailabilityGuardPatch(html);
    if (typeof window.applyWlbOptimizerPatch === 'function') {
      html = window.applyWlbOptimizerPatch(html);
    }
    if (typeof window.applyBalancedTemplatePatch === 'function') {
      html = window.applyBalancedTemplatePatch(html);
    }
    if (typeof window.applyFranFridayPatch === 'function') {
      html = window.applyFranFridayPatch(html);
    }
    if (typeof window.applySaturdayFohPatch === 'function') {
      html = window.applySaturdayFohPatch(html);
    }
    if (typeof window.applyBarFloorGuardPatch === 'function') {
      html = window.applyBarFloorGuardPatch(html);
    }
    if (typeof window.applyCleanShiftLabelsPatch === 'function') {
      html = window.applyCleanShiftLabelsPatch(html);
    }
    html = html.replace('</body>', '<div style="position:fixed;right:8px;bottom:6px;z-index:9999;font:10px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:#6B776E;background:#16211BCC;padding:2px 5px;border-radius:4px;pointer-events:none">Build 00:10-sat-split</div></body>');
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error(error);
    document.getElementById('boot').textContent = 'Rota failed to load. Please refresh the page.';
  }
})();
</script>
</body>
</html>
