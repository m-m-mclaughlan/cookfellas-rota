<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function () {
  var PREFIX = "cookfellas-rota::";
  window.storage = {
    get: function (key, shared) { return Promise.resolve().then(function () { var raw = localStorage.getItem(PREFIX + key); if (raw === null) return null; return { key: key, value: raw, shared: !!shared }; }); },
    set: function (key, value, shared) { return Promise.resolve().then(function () { localStorage.setItem(PREFIX + key, value); return { key: key, value: value, shared: !!shared }; }); },
    delete: function (key, shared) { return Promise.resolve().then(function () { localStorage.removeItem(PREFIX + key); return { key: key, deleted: true, shared: !!shared }; }); },
    list: function (prefix, shared) { return Promise.resolve().then(function () { var full = PREFIX + (prefix || ""); var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf(full) === 0; }).map(function (k) { return k.slice(PREFIX.length); }); return { keys: keys, prefix: prefix, shared: !!shared }; }); }
  };
})();
window.__cookfellasApp = "";
</script>
