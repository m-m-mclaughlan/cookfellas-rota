<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cookfella's Bar & Eatery — Rota</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #16211B; }
  #boot { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #9AA79C; text-align: center; padding: 40px; }
</style>
</head>
<body>
<div id="boot">Loading rota…</div>
<script src="./patches.js?v=20260816-1554"></script>
<script>
(async function () {
  try {
    const response = await fetch('./app-original.html', { cache: 'no-store' });
    if (!response.ok) throw new Error('Could not load rota app');
    let html = await response.text();
    if (typeof window.applyCookfellasPatches !== 'function') throw new Error('Rota patches failed to load');
    html = window.applyCookfellasPatches(html);
    document.open();
    document.write(html);
    document.close();
  } catch (error) {
    console.error(error);
    document.getElementById('boot').textContent = 'Rota failed to load. Please refresh the page.';
  }
})();
</script>
</body>
</html>
